<style>

<script>
// ---- payload (no hard-coded figures: missing values are null and render as "—") ----
let DATA={};try{DATA=JSON.parse(document.getElementById('floor-data').textContent)||{}}catch(e){DATA={}}
const HD=DATA.header||{},AG=DATA.agents||{},TRADES=DATA.trades||[],CY=DATA.cycle||null,SYM=DATA.symbols||{};

const isEx=k=>EXF.has(k)||[...EXF].some(f=>f.startsWith(k+'.'));
const BADGE='<span class="ex">EJEMPLO</span>',badge=k=>isEx(k)?BADGE:'';

const fR=v=>ok(v)?(v<0?'−':v>0?'+':'')+Math.abs(v).toFixed(2)+' R':NA;
const px=v=>ok(v)?v.toFixed(5):NA;
const pct=(v,d=1)=>ok(v)?v.toFixed(d)+'%':NA;
const tone=v=>ok(v)?(v>0?'pos':v<0?'neg':''):'na';
const SRC={OANDA_DEMO:'OANDA Demo',PAPER:'PAPER'}[DATA.source]||null;
const SIDE={LONG:'Long',SHORT:'Short'};
let TR=TRADES.find(t=>t.status==='OPEN')||TRADES[0]||null;

// ---- header ----
document.getElementById('brandSub').innerHTML=`V2.1 · ${esc(SRC||EMPTY)} · <b>${esc(HD.day_text||NA)}</b>${badge('header.day_text')}`;
const dl=(ok(HD.daily_loss_used_pct)||ok(HD.daily_loss_limit_pct))?`${ok(HD.daily_loss_used_pct)?HD.daily_loss_used_pct.toFixed(1):NA} / ${pct(HD.daily_loss_limit_pct)}`:NA;
const dd=ok(HD.drawdown_pct)?(HD.drawdown_pct>0?'−':'')+HD.drawdown_pct.toFixed(2)+'%':ok(HD.drawdown)?money(-HD.drawdown):NA;
const KP=[[money(HD.equity),'Equity',ok(HD.equity)?'':'na',['equity']],[money(HD.pnl,1),'PnL',tone(HD.pnl),['pnl']],[fR(HD.r_total),'R total',tone(HD.r_total),['r_total']],
 [ok(HD.win_rate)?HD.win_rate.toFixed(0)+'%':NA,'Win rate',ok(HD.win_rate)?'':'na',['win_rate']],[dd,'Drawdown',ok(HD.drawdown_pct)||ok(HD.drawdown)?(HD.drawdown>0||HD.drawdown_pct>0?'neg':''):'na',['drawdown','drawdown_pct']],[dl,'Daily loss',dl==NA?'na':'',['daily_loss_used_pct','daily_loss_limit_pct']]];

document.getElementById('kpis').innerHTML=KP.map(k=>`<div class="kpi"><b class="${k[2]}">${esc(k[0])}</b><small>${k[1]}${k[3].some(f=>EXF.has('header.'+f))?BADGE:''}</small></div>`).join('');

document.getElementById('note').innerHTML=`<span class="hint">Pellizca o usa la rueda para zoom · doble clic para centrar · </span>Solo lectura · `+
 (EXF.size?`<i>EJEMPLO</i> en partes sin datos reales`:real?`<i>datos reales</i>${SRC?' · '+esc(SRC):''}`:`<i>${EMPTY}</i>`)+
 (CY&&CY.as_of?` · último ciclo ${esc(CY.as_of)}${CY.status?' · '+esc(CY.status):''}`:'');

const STEPS=["Datos","Análisis","Reviewer","Conflict Engine","Risk Engine","Plan R:R","Entry / Exit","Resultado"];
const CSTEPS=(CY&&CY.steps)||[];
const COL={Structure:'#a77bff',Liquidity:'#4a7dff',Macro:'#ffb020',Risk:'#ff3d9a',Reviewer:'#2ee59d',Conflict:'#ff7a1a',RiskEng:'#ff2e4d',Exec:'#39ff88'};
const RCOL={'Structure':COL.Structure,'Liquidity':COL.Liquidity,'Macro':COL.Macro,'Risk':COL.Risk,'Reviewer':COL.Reviewer,'Conflict Engine':COL.Conflict,'Risk Engine':COL.RiskEng};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const W=18,D=14,H=3.9,STEP_MS=4200;
const q=new URLSearchParams(location.search);const FIX=q.has('step')?+q.get('step'):null;
const cv=document.getElementById('c'),cx=cv.getContext('2d');let U=30,ox=0,oy=0,Z=1,PX=0,PY=0,dpr=1,vw=0,vh=0;
const P=(x,y,z=0)=>[ox+(x-y)*U,oy+(x+y)*U/2-z*U];
function fit(){const r=cv.getBoundingClientRect();dpr=devicePixelRatio||1;vw=r.width;vh=r.height;cv.width=vw*dpr;cv.height=vh*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
 const padT=vh*.12,pad=16;U=Math.min((vw-pad*2)/(W+D),(vh-padT-pad)/((W+D)/2+H));ox=pad+D*U+((vw-pad*2)-(W+D)*U)/2;oy=padT+H*U+((vh-padT-pad)-((W+D)/2+H)*U)/2;
 if(Z0==null)Z0=vw<600?1.45:1; const Zt=Z0*Z; const cxm=vw/2,cym=vh/2; ox=cxm+(ox-cxm)*Zt+PX; oy=cym+(oy-cym)*Zt+PY-(vw<600?vh*.1:0); U*=Zt;}
let Z0=null;
addEventListener('resize',fit);
function poly(pts,fill,stroke,lw=1){cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke()}}

 poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],c[1],edge);

const ROOMS=[
 {n:'Structure',x:.4,y:.4,w:4,d:3,door:'f'},{n:'Liquidity',x:4.8,y:.4,w:4,d:3,door:'f'},
 {n:'Macro',x:9.2,y:.4,w:4,d:3,door:'f'},{n:'Risk',x:13.6,y:.4,w:4,d:3,door:'f'},
 {n:'Reviewer',x:.4,y:4.3,w:3.4,d:3,door:'r'},{n:'Conflict Engine',x:.4,y:7.6,w:3.4,d:3,door:'r'},{n:'Risk Engine',x:.4,y:10.9,w:3.4,d:2.7,door:'r'}];
ROOMS.forEach(r=>{r.dx=r.door=='f'?r.x+r.w/2:r.x+r.w+.35;r.dy=r.door=='f'?r.y+r.d+.35:r.y+r.d/2});
function room(r,hot){const C=RCOL[r.n];const g=rgba(C,hot?.95:.42);cx.shadowColor=C;cx.shadowBlur=hot?14:2;const z=1.25;
 poly([P(r.x,r.y),P(r.x+r.w,r.y),P(r.x+r.w,r.y+r.d),P(r.x,r.y+r.d)],rgba(C,hot?.12:.035),null);
 poly([P(r.x,r.y),P(r.x,r.y+r.d),P(r.x,r.y+r.d,z),P(r.x,r.y,z)],rgba(C,hot?.07:.02),g,.8);
 poly([P(r.x,r.y),P(r.x+r.w,r.y),P(r.x+r.w,r.y,z),P(r.x,r.y,z)],rgba(C,hot?.07:.02),g,.8);
 cx.shadowBlur=0;
 const dx=r.x+r.w/2-.9,dy=r.y+.45;box(dx,dy,0,1.8,.7,.42,DESK);
 box(dx+.25,dy+.12,.42,.55,.06,.38,MON);box(dx+1,dy+.12,.42,.55,.06,.38,MON);
 cx.globalAlpha=.85;poly([P(dx+.27,dy+.18,.46),P(dx+.78,dy+.18,.46),P(dx+.78,dy+.18,.77),P(dx+.27,dy+.18,.77)],hot?C:rgba(C,.45));poly([P(dx+1.02,dy+.18,.46),P(dx+1.53,dy+.18,.46),P(dx+1.53,dy+.18,.77),P(dx+1.02,dy+.18,.77)],hot?rgba(C,.75):rgba(C,.3));cx.globalAlpha=1;
 r.after=()=>{cx.shadowColor=C;cx.shadowBlur=hot?14:2;
  const fy=r.y+r.d,fx=r.x+r.w;
  if(r.door=='f'){poly([P(r.x,fy),P(r.dx-.5,fy),P(r.dx-.5,fy,z),P(r.x,fy,z)],rgba(C,hot?.08:.025),g,.8);poly([P(r.dx+.5,fy),P(fx,fy),P(fx,fy,z),P(r.dx+.5,fy,z)],rgba(C,hot?.08:.025),g,.8);poly([P(fx,r.y),P(fx,fy),P(fx,fy,z),P(fx,r.y,z)],rgba(C,hot?.08:.025),g,.8)}
  else{poly([P(r.x,fy),P(fx,fy),P(fx,fy,z),P(r.x,fy,z)],rgba(C,hot?.08:.025),g,.8);poly([P(fx,r.y),P(fx,r.dy-.5),P(fx,r.dy-.5,z),P(fx,r.y,z)],rgba(C,hot?.08:.025),g,.8);poly([P(fx,r.dy+.5),P(fx,fy),P(fx,fy,z),P(fx,r.dy+.5,z)],rgba(C,hot?.08:.025),g,.8)}
  cx.shadowBlur=0;
  const [lx,ly]=P(r.x+.25,fy-.1);cx.save();cx.translate(lx,ly);cx.transform(1,-.5,0,1,0,0);
  cx.font=`${Math.max(8,U*.30)}px Didot,Georgia,serif`;cx.fillStyle=hot?C:rgba(C,.75);cx.textBaseline='bottom';cx.fillText(r.n.toUpperCase(),0,0);cx.restore();}
}
// characters
const A={};function agent(id,room,col){const r=ROOMS.find(o=>o.n==room);A[id]={id,room:r,hx:r.x+r.w/2,hy:r.y+1.55,x:0,y:0,col,walk:0,carry:0};}
agent('Structure','Structure');agent('Liquidity','Liquidity');agent('Macro','Macro');agent('Risk','Risk');
agent('Reviewer','Reviewer');agent('Conflict','Conflict Engine');agent('RiskEng','Risk Engine');
A.Exec={id:'Exec',hx:9.2,hy:8.6,x:0,y:0,walk:0,carry:0};
const live=SYM.EURUSD==='ACTIVE';
const DESKS=[{s:'EURUSD',x:8.5,y:7.2,live:live?1:0},{s:'XAUUSD',x:12.6,y:7.2,live:SYM.XAUUSD==='ACTIVE'?1:0}];
const SPARE=[[8.5,10.6],[12.6,10.6]];
function deskSub(d){const st=SYM[d.s];if(st==='PAUSED')return 'PAUSADO';if(st==='DISABLED')return 'APAGADO';
 if(d.s==='EURUSD'){if(TR&&TR.status==='OPEN')return `${(TR.side||NA)} · ${fR(TR.r_realized)}`;return st==='ACTIVE'?'ACTIVO · sin posición':EMPTY}
 return st==='ACTIVE'?'ACTIVO':EMPTY}
function person(a,t,hot){const C=COL[a.id];const [x,y]=P(a.x,a.y,0);const s=U/30;const bob=a.walk?Math.abs(Math.sin(t/120))*2*s:Math.sin(t/700+a.hx)*0.8*s;
 cx.fillStyle='rgba(0,0,0,.55)';cx.beginPath();cx.ellipse(x,y,7*s,3.5*s,0,0,7);cx.fill();
 if(hot){cx.strokeStyle=C;cx.shadowColor=C;cx.shadowBlur=10;cx.lineWidth=1.5;cx.beginPath();cx.ellipse(x,y,12*s,6*s,0,0,7);cx.stroke();cx.shadowBlur=0}
 const lg=a.walk?Math.sin(t/120)*3*s:0;cx.strokeStyle='#151a1d';cx.lineWidth=3*s;cx.lineCap='round';
 cx.beginPath();cx.moveTo(x-2*s,y-9*s-bob);cx.lineTo(x-2*s+lg,y-1*s);cx.moveTo(x+2*s,y-9*s-bob);cx.lineTo(x+2*s-lg,y-1*s);cx.stroke();
 const by=y-bob;cx.fillStyle='#1a2024';cx.strokeStyle=hot?C:rgba(C,.6);cx.lineWidth=1;
 cx.beginPath();cx.roundRect(x-6*s,by-22*s,12*s,14*s,4*s);cx.fill();cx.stroke();
 cx.fillStyle=hot?C:rgba(C,.7);cx.fillRect(x-.7*s,by-21*s,1.4*s,9*s);
 cx.fillStyle='#d9c7a3';cx.beginPath();cx.arc(x,by-27*s,5*s,0,7);cx.fill();
 cx.fillStyle='#1c2326';cx.beginPath();cx.arc(x,by-28.5*s,5*s,Math.PI,0);cx.fill();
 if(a.carry){cx.save();cx.translate(x+8*s,by-16*s);cx.rotate(.785);cx.fillStyle='#19e3d3';cx.shadowColor='#19e3d3';cx.shadowBlur=10;cx.fillRect(-3.5*s,-3.5*s,7*s,7*s);cx.restore()}
 a.head=[x,by-34*s];}
function bubble(a,txt,hot,sub){if(!a.head)return;const C=COL[a.id]||'#19e3d3';const [hx,hy]=a.head;const s=Math.max(.75,Math.min(1.15,U/34));
 cx.font=`${(hot?12:10.5)*s}px "Helvetica Neue",Arial,sans-serif`;const w1=cx.measureText(txt).width;let w2=0;
 if(sub){cx.font=`${9*s}px "Helvetica Neue",Arial`;w2=cx.measureText(sub).width}
 const pw=Math.max(w1,w2)+18*s,ph=(sub?36:22)*s,bx=Math.max(4,Math.min(vw-pw-4,a.al?hx-16*s:hx-pw/2));let by=Math.max(4,hy-ph-9*s);
 for(let k=0;k<6;k++){const o=PLACED.find(r=>bx<r[0]+r[2]+4&&bx+pw+4>r[0]&&by<r[1]+r[3]+4&&by+ph+4>r[1]);if(!o)break;by=o[1]-ph-6}PLACED.push([bx,by,pw,ph]);
 cx.globalAlpha=hot?1:.9;cx.fillStyle=hot?'#101016':'#0c0c10';cx.strokeStyle=hot?C:rgba(C,.55);cx.lineWidth=hot?1.4:1;if(hot){cx.shadowColor=C;cx.shadowBlur=14}
 cx.beginPath();cx.roundRect(bx,by,pw,ph,3*s);cx.fill();cx.stroke();cx.shadowBlur=0;cx.fillStyle=C;cx.fillRect(bx+1,by+3*s,2.2*s,ph-6*s);cx.fillStyle=hot?C:rgba(C,.55);
 if(hy-(by+ph)>12*s){cx.beginPath();cx.moveTo(hx,by+ph);cx.lineTo(hx,hy-1);cx.stroke()}else{cx.beginPath();cx.moveTo(hx-5*s,by+ph-.5);cx.lineTo(hx,hy-1);cx.lineTo(hx+5*s,by+ph-.5);cx.closePath();cx.fill()}
 cx.fillStyle=hot?'#ffffff':'#cfcfd8';cx.textBaseline='middle';cx.font=`${(hot?12:10.5)*s}px "Helvetica Neue",Arial`;cx.fillText(txt,bx+9*s,by+11*s);
 if(sub){cx.fillStyle=hot?C:rgba(C,.8);cx.font=`${9*s}px "Helvetica Neue",Arial`;cx.fillText(sub,bx+9*s,by+25*s)}cx.globalAlpha=1}
