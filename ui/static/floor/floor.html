<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Trading Floor — Floor</title>
<!-- Read-only Floor view (port of the approved mockup v4). Every figure comes from the payload injected by
     ui/views/floor_view.py (ui/floor_payload.py); this file holds no data and fetches nothing.
     Idle (no cycle running) = ONE static drawing, redrawn only on demand (load, resize, zoom/pan, drawer); the
     time ticker runs ONLY while payload.running.active (a real RUNNING cycle) and animates only the step it reached. -->
<style>
:root{--gold:#19e3d3;--gold2:#9ff5ee;--ink:#0a0a0b;--line:#1a2325;--mute:#7f9593;--dim:#6f8583}
*{box-sizing:border-box}html,body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--ink);color:#e6eef0;font-family:"Helvetica Neue",Inter,Arial,sans-serif;overflow:hidden}
.serif{font-family:Didot,"Bodoni 72","Playfair Display",Georgia,serif}
header{min-height:78px;display:flex;align-items:center;justify-content:space-between;padding:10px 36px;border-bottom:1px solid var(--line);gap:24px}
.brand{display:flex;flex-direction:column;gap:4px;flex:none}
.brand h1{margin:0;font-weight:400;font-size:24px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold2)}
.brand div{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.brand b{color:var(--gold);font-weight:600}
.ex{border:1px solid var(--gold);color:var(--gold);padding:2px 7px;margin-left:8px;font-size:10px;letter-spacing:.2em;font-weight:400;vertical-align:middle}
/* HUD cells wrap onto a second row instead of overlapping / being cut at the right edge */
.kpis{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 24px;min-width:0}.kpi{text-align:right;min-width:56px;max-width:150px}.kpi .ex{margin-left:5px;padding:1px 4px;font-size:10px;letter-spacing:.12em}
.kpi b{display:block;font-size:17px;font-weight:300;letter-spacing:.02em;white-space:nowrap}.kpi b.txt{font-size:11px;line-height:1.25;padding:0 0 2px;letter-spacing:.04em;white-space:normal;width:min-content;margin-left:auto}
.kpi small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}.kpi small.b2{letter-spacing:.06em;text-transform:none}
.pos{color:#3ddc84}.neg{color:#ff4d6d}.na{color:var(--mute)}
main{position:relative;flex:1;min-height:0;overflow:hidden}header,footer{flex:none}
#stage{position:absolute;left:0;top:0;bottom:0;right:0;display:flex;flex-direction:column;transition:right .5s cubic-bezier(.2,.8,.2,1),bottom .5s}
canvas{flex:1 1 0;min-height:0;width:100%;display:block;cursor:default}
/* narrow stage (body.mob, set in fit()): the desk status boxes become this HTML strip under the canvas */
#legend{display:none;flex:none;flex-wrap:wrap;gap:2px 16px;padding:8px 14px 10px;border-top:1px solid var(--line);font-size:11px;line-height:1.5;letter-spacing:.04em;color:var(--mute)}
#legend b{color:var(--gold2);font-weight:600;letter-spacing:.08em}#legend .on{color:#3ddc84}#legend .pa{color:#ffb020}#legend [onclick]{cursor:pointer}
body.mob #legend{display:flex}body.mob .note{position:static;flex:none;padding:6px 14px;line-height:1.4}body.mob .hint{display:none}
body.open #stage{right:440px}
footer{height:78px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 36px;gap:0;position:relative}
.step{flex:1;position:relative;font-size:10px;line-height:1.25;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:16px 8px 0 0}
.step:before{content:"";position:absolute;top:4px;left:0;right:8px;height:1px;background:#1a2325}
.step:after{content:"";position:absolute;top:0;left:0;width:9px;height:9px;border-radius:50%;border:1px solid #2a5553;background:var(--ink)}
.step.done{color:#9fc9c6}.step.done:before{background:#0b7f7c}.step.done:after{background:#0b7f7c;border-color:#0b7f7c}
.step.on{color:var(--gold2)}.step.on:after{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.step em{display:block;font-style:normal;color:#3ddc84;font-size:10px;margin-top:3px;letter-spacing:.06em}.step.real{font-weight:600}
.snote{display:none}
.note{position:absolute;left:36px;bottom:14px;right:36px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hint{color:var(--dim)}.note i{color:var(--gold);font-style:normal}
#drawer{position:absolute;top:0;right:0;bottom:0;width:440px;border-left:1px solid var(--line);background:#0d0d0e;padding:34px 34px;transform:translateX(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow:auto}
body.open #drawer{transform:none}
#drawer h2{margin:0;font-weight:400;font-size:26px;color:var(--gold2);letter-spacing:.04em}
.sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:8px 0 26px;line-height:1.5}
.x{position:absolute;top:26px;right:28px;color:var(--mute);cursor:pointer;font-size:22px;font-weight:200}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:400;text-align:right;padding:0 0 10px}
td{padding:11px 0;border-top:1px solid #162022;text-align:right;font-weight:300}
td:first-child,th:first-child{text-align:left;color:#a9bfbd}
tr.pick{cursor:pointer}tr.pick:hover td{color:var(--gold2)}
.lab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:30px 0 10px}
.big{display:flex;gap:30px}.big div b{display:block;white-space:nowrap;font-size:26px;font-weight:300}.big small{font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.rr{position:relative;height:46px;margin-top:6px}
.rr .seg{position:absolute;top:18px;height:4px}.rr .t{position:absolute;top:0;font-size:10px;letter-spacing:.06em;color:var(--mute);transform:translateX(-50%);white-space:nowrap}
.rr .t.l{left:0;transform:none}.rr .t.r{right:0;transform:none}.rr .t2{top:28px}.rr .dot{position:absolute;top:14px;width:12px;height:12px;border-radius:50%;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 10px var(--gold)}
.chain{font-size:12px;line-height:2;color:#a9bfbd;font-weight:300}.chain span{color:var(--gold)}
.empty{font-size:12px;color:var(--mute);letter-spacing:.08em}
@media (max-width:1280px){.step{letter-spacing:.05em;padding-right:6px}}
@media (max-width:1100px){.brand h1{font-size:20px;letter-spacing:.26em}.kpis{column-gap:16px}.kpi b{font-size:15px}.kpi small{letter-spacing:.1em}}
@media (max-width:820px){
 header{height:auto;flex-direction:column;align-items:flex-start;padding:14px 16px;gap:10px}
 .brand h1{font-size:17px}.kpis{gap:0;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px;column-gap:8px}.kpi{text-align:left;min-width:0;max-width:none}.kpi b{font-size:14px;white-space:normal;overflow-wrap:anywhere}.kpi b.txt{font-size:11px;margin-left:0}
 .kpi small{letter-spacing:.04em}.kpi small:first-of-type{white-space:nowrap}
 footer{min-height:94px;height:auto;padding:10px 14px 30px;flex-wrap:wrap;gap:8px 0}.step{flex:0 0 25%;font-size:8px;padding:14px 4px 0 0;letter-spacing:0;min-width:0}.step.on{font-size:8px}.step em{font-size:8px}.step.on em{font-size:8px}
 body.idle .snote{display:block;position:absolute;left:14px;right:14px;bottom:8px;font-size:11px;letter-spacing:.06em;color:#9fc9c6}
 body.idle .step{padding-top:14px;align-self:flex-start;margin-top:0}
 .note{left:14px;right:14px;bottom:auto;top:6px;font-size:10px;letter-spacing:.06em}.hint{display:none}
 body.open #stage{right:0;bottom:58%}
 #drawer{width:100%;top:auto;height:58%;border-left:0;border-top:1px solid var(--gold);transform:translateY(100%);padding:22px}
 #drawer h2{font-size:20px}.big div b{font-size:22px}
 .big{flex-wrap:wrap;gap:12px 20px}.big div{flex:1 1 84px;min-width:0}.big div b{white-space:normal;overflow-wrap:anywhere}
 table{table-layout:fixed}td,th{overflow-wrap:anywhere;padding-left:4px}th{letter-spacing:.06em}
}
@media (max-width:360px){#drawer{padding:16px 14px}.big div{flex-basis:100%}.big div b{font-size:19px}td{font-size:12px}}
</style></head><body>
<script id="floor-data" type="application/json">__FLOOR_PAYLOAD__</script>
<header>
 <div class="brand"><h1 class="serif">AI Trading Floor</h1><div id="brandSub"></div></div>
 <div class="kpis" id="kpis"></div>
</header>
<main>
 <div id="stage"><canvas id="c"></canvas><div id="legend"></div><div class="note" id="note"></div></div>
 <aside id="drawer"><span class="x" onclick="closeD()">×</span><div id="agentV" style="display:none"></div><div id="tradeV"></div></aside>
</main>
<footer id="steps"></footer>
<script>
// ---- payload (no hard-coded figures: missing values are null and render as "—") ----
let DATA={};try{DATA=JSON.parse(document.getElementById('floor-data').textContent)||{}}catch(e){DATA={}}
const HD=DATA.header||{},AG=DATA.agents||{},TRADES=DATA.trades||[],CY=DATA.cycle||null,SYM=DATA.symbols||{};
const FEED=DATA.feed||[],ML=(DATA.market&&DATA.market.lines)||[],CURVE=DATA.curve||[];
const EXF=new Set(DATA.sample_mode?(DATA.example_fields||[]):[]);
const isEx=k=>EXF.has(k)||[...EXF].some(f=>f.startsWith(k+'.'));
const BADGE='<span class="ex">EJEMPLO</span>',badge=k=>isEx(k)?BADGE:'';
// a cycle is "running" ONLY when the DB has a fresh RUNNING run (payload.running, built in ui/floor_payload.py)
const RUN=DATA.running||{},DEADLINE=Date.parse(RUN.deadline);
let ACTIVE=RUN.active===true&&Number.isFinite(DEADLINE)&&Date.now()<DEADLINE;
const WAITING=DATA.waiting===true,WTXT=DATA.waiting_text||'Esperando el primer ciclo';
// a stale (last good / old) demo NAV is never shown as current: value + "(dato antiguo · HH:MM ET)"
const STALE=HD.equity_stale===true&&HD.equity_as_of?`(dato antiguo · ${HD.equity_as_of} ET)`:'';
// same for every section derived from the cached demo trades read (PnL, R, win rate, drawdown, curve, trades, hit rate)
const TSTALE=HD.trades_stale===true?`(dato antiguo${HD.trades_as_of?` · ${HD.trades_as_of} ET`:''})`:'';
const NA='—',EMPTY='sin datos aún',NOOP='sin operaciones aún',NOOPK='sin operaciones';  // NOOPK: HUD cell, two muted lines
const NOTR=HD.trades===0;  // stats known and no closed trade yet
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=v=>typeof v==='number'&&isFinite(v);
const money=(v,signed)=>ok(v)?(v<0?'−':signed&&v>0?'+':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):NA;
const fR=v=>ok(v)?(v<0?'−':v>0?'+':'')+Math.abs(v).toFixed(2)+' R':NA;
const px=v=>ok(v)?v.toFixed(5):NA;
const pct=(v,d=1)=>ok(v)?v.toFixed(d)+'%':NA;
const tone=v=>ok(v)?(v>0?'pos':v<0?'neg':''):'na';
const SRC={OANDA_DEMO:'OANDA Demo',PAPER:'Práctica interna'}[DATA.source]||null;
const SIDE={LONG:'Long',SHORT:'Short'};
const UNITS=v=>ok(v)?v.toLocaleString('en-US',{maximumFractionDigits:0})+' unidades':NA+' unidades';
let TR=TRADES.find(t=>t.status==='OPEN')||TRADES[0]||null;
const OPEN=TRADES.find(t=>t.status==='OPEN')||null;  // the routed trade open right now (only Echo reflects it)

// ---- header ----
document.getElementById('brandSub').innerHTML=`V2.1 · ${esc(SRC||EMPTY)} · <b>${esc(HD.day_text||NA)}</b>${badge('header.day_text')}`;
const dl=(ok(HD.daily_loss_used_pct)||ok(HD.daily_loss_limit_pct))?`${ok(HD.daily_loss_used_pct)?HD.daily_loss_used_pct.toFixed(1):NA} / ${pct(HD.daily_loss_limit_pct)}`:NA;
const DLT=HD.daily_loss_text||'';
const dd=ok(HD.drawdown_pct)?(HD.drawdown_pct>0?'−':'')+HD.drawdown_pct.toFixed(2)+'%':ok(HD.drawdown)?money(-HD.drawdown):NA;
const wr=NOTR?NOOPK:ok(HD.win_rate)?HD.win_rate.toFixed(0)+'%':NA;
const rt=NOTR?NOOPK:fR(HD.r_total);
// the balance appears under the NAV only when it differs from it (never the same figure twice)
const BALX=ok(HD.balance)&&!(ok(HD.equity)&&Math.abs(HD.balance-HD.equity)<.005);
// [value, label, class, payload keys, extra small line, tooltip]
const KP=[[money(HD.equity),'NAV',ok(HD.equity)?'':'na',['equity','balance'],BALX?'Balance '+money(HD.balance):''],
 [money(HD.pnl,1),'P&L realizado',tone(HD.pnl),['pnl']],[money(HD.today_pnl,1),'P&L hoy',tone(HD.today_pnl),['today_pnl']],
 [rt,'R total',NOTR?'na txt':tone(HD.r_total),['r_total']],[wr,'Tasa de acierto',NOTR?'na txt':ok(HD.win_rate)?'':'na',['win_rate']],
 [dd,'Caída máx.',ok(HD.drawdown_pct)||ok(HD.drawdown)?(HD.drawdown>0||HD.drawdown_pct>0?'neg':''):'na',['drawdown','drawdown_pct']],
 [dl,'Pérdida diaria',dl==NA?'na':HD.daily_loss_status==='TRIGGERED'?'neg':'',['daily_loss_used_pct','daily_loss_limit_pct','daily_loss_text'],DLT]];
// EJEMPLO next to each KPI that fell back to example data (sample mode only)
document.getElementById('kpis').innerHTML=KP.map(k=>`<div class="kpi" title="${esc(k[1]+(k[4]?' · '+k[4]:''))}"><b class="${k[2]}">${esc(k[0])}</b><small>${k[1]}${k[3].some(f=>EXF.has('header.'+f))?BADGE:''}</small>${k[4]?`<small class="b2">${esc(k[4])}</small>`:''}</div>`).join('');
const oldMarker=STALE||TSTALE;
const ageTimes=[HD.equity_as_of?`NAV ${HD.equity_as_of} ET`:'',(HD.trades_as_of||HD.trades_stale)?`operaciones ${HD.trades_as_of?HD.trades_as_of+' ET':'sin hora'}`:''].filter(Boolean);
if(oldMarker)document.getElementById('brandSub').innerHTML+=`<small class="data-age"> · ${esc('dato antiguo · '+ageTimes.join(' · '))}</small>`;
// "datos reales" ONLY when the newest data point is fresh (payload.note_real); never on old / pre-epoch data
const noteMain=EXF.size?`<i>EJEMPLO</i> en partes sin datos reales`:DATA.note_real?`<i>datos reales</i>${SRC?' · '+esc(SRC):''}`:
 WAITING?`<i>${esc(WTXT)}</i>${DATA.epoch_text?' · demo desde '+esc(DATA.epoch_text):''}`:DATA.cycle_text?'':`<i>${EMPTY}</i>`;
document.getElementById('note').innerHTML=`<span class="hint">Pellizca o usa la rueda para zoom · doble clic para centrar · </span>Solo lectura`+
 (noteMain?' · '+noteMain:'')+(DATA.cycle_text?` · ${esc(DATA.cycle_text)}`:'')+(ACTIVE?`<span id="running-note"> · <i>ciclo en marcha</i>${RUN.started_at_text?' desde '+esc(RUN.started_at_text):''}</span>`:'');

const STEPS=["Datos","Análisis","Revisor","Motor de conflictos","Motor de riesgo","Plan R:R","Entrada / Salida","Resultado"];
const CSTEPS=(CY&&CY.steps)||[];
const COL={Structure:'#a77bff',Liquidity:'#4a7dff',Macro:'#ffb020',Risk:'#ff3d9a',Reviewer:'#2ee59d',Conflict:'#ff7a1a',RiskEng:'#ff2e4d',Exec:'#39ff88'};
const RCOL={'Structure':COL.Structure,'Liquidity':COL.Liquidity,'Macro':COL.Macro,'Risk':COL.Risk,'Reviewer':COL.Reviewer,'Conflict Engine':COL.Conflict,'Risk Engine':COL.RiskEng};
const RLAB={'Structure':'Estructura','Liquidity':'Liquidez','Macro':'Macro','Risk':'Riesgo','Reviewer':'Revisor','Conflict Engine':'Conflictos','Risk Engine':'Motor de riesgo'};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const W=18,D=14,H=3.9,STEP_MS=4200,MINPX=10;
const q=new URLSearchParams(location.search);const FIX=q.has('step')?+q.get('step'):null;
// the step shown: ?step=N (screenshots / tests) > the step a really running cycle reached > none (idle: static)
let STEP=FIX!=null&&FIX>=0&&FIX<8?Math.floor(FIX):ACTIVE&&Number.isInteger(RUN.step)&&RUN.step>=0&&RUN.step<8?RUN.step:null;
let ANIM=ACTIVE&&FIX==null&&STEP!=null;  // time-based animation ONLY while a real cycle runs
if(STEP==null)document.body.classList.add('idle');
const cv=document.getElementById('c'),cx=cv.getContext('2d');let U=30,ox=0,oy=0,Z=1,PX=0,PY=0,dpr=1,vw=0,vh=0;
const P=(x,y,z=0)=>[ox+(x-y)*U,oy+(x+y)*U/2-z*U];
let Z0=null;
// the whole scene fits the canvas (also 390×844 portrait); pinch / wheel zoom and drag move it on demand.
// Narrow stage (< 600 px, body.mob): fit the rooms + wall screens (x−y from XL to XR), not the empty floor corners,
// and show the desk legend strip under the canvas (toggled before measuring: it changes the canvas height)
const XL=-13.4,XR=17.4;
function fit(){document.body.classList.toggle('mob',document.getElementById('stage').clientWidth<600);
 const r=cv.getBoundingClientRect();dpr=devicePixelRatio||1;vw=r.width;vh=r.height;cv.width=vw*dpr;cv.height=vh*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
 const m=MOB(),xl=m?XL:-D,xr=m?XR:W,padT=vh*.12,pad=m?4:12;
 U=Math.min((vw-pad*2)/(xr-xl),(vh-padT-pad)/((W+D)/2+H));ox=pad-xl*U+((vw-pad*2)-(xr-xl)*U)/2;oy=padT+H*U+((vh-padT-pad)-((W+D)/2+H)*U)/2;
 if(Z0==null)Z0=1; const Zt=Z0*Z; const cxm=vw/2,cym=vh/2; ox=cxm+(ox-cxm)*Zt+PX; oy=cym+(oy-cym)*Zt+PY; U*=Zt;redraw()}
// draw on demand: one coalesced redraw per frame at most (idle never loops)
let queued=0;function redraw(){if(queued)return;queued=1;requestAnimationFrame(n=>{queued=0;draw(ANIM?n-t0:0)})}
addEventListener('resize',fit);
const fpx=sz=>Math.max(MINPX,sz*U/30);
function fitText(t,w){t=String(t);if(cx.measureText(t).width<=w)return t;while(t.length>1&&cx.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function poly(pts,fill,stroke,lw=1){cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke()}}
function box(x,y,z,w,d,h,c,a=1,edge){cx.globalAlpha=a;
 poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],c[1],edge);
 poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],c[2],edge);
 poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],c[0],edge);cx.globalAlpha=1}
const DESK=['#20272a','#0d1416','#181e21'],MON=['#111','#0b0b0b','#151515'];
// rooms
const ROOMS=[
 {n:'Structure',x:.4,y:.4,w:4,d:3,door:'f'},{n:'Liquidity',x:4.8,y:.4,w:4,d:3,door:'f'},
 {n:'Macro',x:9.2,y:.4,w:4,d:3,door:'f'},{n:'Risk',x:13.6,y:.4,w:4,d:3,door:'f'},
 {n:'Reviewer',x:.4,y:4.3,w:3.4,d:3,door:'r'},{n:'Conflict Engine',x:.4,y:7.6,w:3.4,d:3,door:'r'},{n:'Risk Engine',x:.4,y:10.9,w:3.4,d:2.7,door:'r'}];
ROOMS.forEach(r=>{r.dx=r.door=='f'?r.x+r.w/2:r.x+r.w+.35;r.dy=r.door=='f'?r.y+r.d+.35:r.y+r.d/2});
function room(r,hot){const C=RCOL[r.n];const g=rgba(C,hot?.95:.42);cx.shadowColor=C;cx.shadowBlur=hot?14:2;const z=1.25;
 poly([P(r.x,r.y),P(r.x+r.w,r.y),P(r.x+r.w,r.y+r.d),P(r.x,r.y+r.d)],rgba(C,hot?.12:.035),null);
 poly([P(r.x,r.y),P(r.x,r.y+r.d),P(r.x,r.y+r.d,z),P(r.x,r.y,z)],rgba(C,hot?.07:.02),g,.8);
 poly([P(r.x,r.y),P(r.x+r.w,r.y),P(r.x+r.w,r.y,z),P(r.x,r.y,z)],rgba(C,hot?.07:.02),g,.8);
 cx.shadowBlur=0;
 const dx=r.x+r.w/2-.9,dy=r.y+.45;box(dx,dy,0,1.8,.7,.42,DESK);
 box(dx+.25,dy+.12,.42,.55,.06,.38,MON);box(dx+1,dy+.12,.42,.55,.06,.38,MON);
 cx.globalAlpha=.85;poly([P(dx+.27,dy+.18,.46),P(dx+.78,dy+.18,.46),P(dx+.78,dy+.18,.77),P(dx+.27,dy+.18,.77)],hot?C:rgba(C,.45));poly([P(dx+1.02,dy+.18,.46),P(dx+1.53,dy+.18,.46),P(dx+1.53,dy+.18,.77),P(dx+1.02,dy+.18,.77)],hot?rgba(C,.75):rgba(C,.3));cx.globalAlpha=1;
