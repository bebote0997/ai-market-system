[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pyflakes only: undefined names, unused imports/variables. No style or formatting rules.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Risk Engine file is frozen (EXPERIMENT_FREEZE.md); keep it byte-identical. `stop` at the sizing step is dead.
"execution/risk_engine_v2.py" = ["F841"]
